[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataprocessing-ai"
version = "0.3.0"
description = "AI-native data processing library — REST API, MCP server, and Python package"
readme = "README.md"
# Every optional interface needs 3.10: mcp, fastapi and uvicorn all declare
# >=3.10, so a 3.9 user could install the bare core but none of the three
# interfaces this library exists to provide. Claiming 3.9 was misleading and
# untestable; CI covers 3.10 through 3.13.
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "oluwagbemilesi"}
]
keywords = ["data", "processing", "AI", "REST", "MCP", "pandas"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Upper bounds are deliberate. An unbounded `mcp>=0.9.0` let mcp 2.0 remove
    # the API this package builds on, breaking installs silently; these are the
    # same shape of risk. The suite is run against both ends of this range:
    # pandas 2.2.0/numpy 1.26.4 and pandas 3.0.x/numpy 2.x.
    "pandas>=2.2.0,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    # Floor set by mcp, not by this package: mcp>=1.2.0 requires uvicorn>=0.30.
    "uvicorn>=0.30.0",
    # Floor is set by mcp, not by this package's own needs: mcp>=1.2.0 requires
    # pydantic>=2.10.1, so declaring 2.6.0 here made `[all]` and `[dev]`
    # unsatisfiable at their own stated minimums. CI's floor job found this.
    "pydantic>=2.10.1",
    "python-multipart>=0.0.9",
]
mcp = [
    # mcp 2.0 renamed FastMCP to MCPServer and moved it; mcp_server.py imports
    # whichever is present, and the suite is run against 1.27.2 and 2.0.0 in CI.
    # The bound stops at the next major, which has not been tested against.
    "mcp>=1.2.0,<3.0.0",
]
formats = [
    "openpyxl>=3.1.0",
    "pyarrow>=15.0.0",
]
all = [
    "dataprocessing-ai[api,mcp,formats]",
]
dev = [
    "dataprocessing-ai[all]",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/Techlon/dataprocessing-ai"
Repository = "https://github.com/Techlon/dataprocessing-ai"
Issues = "https://github.com/Techlon/dataprocessing-ai/issues"

[project.scripts]
dataprocessing-mcp = "dataprocessing.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataprocessing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
